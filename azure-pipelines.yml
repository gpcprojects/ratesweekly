# RatesWeekly — build, test, and publish the exes as a pipeline artifact on every master push,
# so teammates with Azure access download a build without needing a dev setup:
# Pipelines → ratesweekly → latest run → Artifacts → ratesweekly-exes (app/RatesWeekly.exe).
# Deliberately minimal — no feed publish (the org's free Artifacts tier is full, see dodgeball's
# HANDOFF), no GitHub-release step (releases to the desk are cut from a dev machine for now).
trigger:
  branches:
    include:
      - master

pool:
  vmImage: windows-latest

steps:
  - task: UseDotNet@2
    displayName: .NET 8 SDK
    inputs:
      packageType: sdk
      version: 8.0.x

  - script: dotnet test tests/RateDesk.Tests/RateDesk.Tests.csproj -c Release
    displayName: tests (must stay green)

  # The central-bank decision scenarios (tests/RateDesk.Scenarios/README.md). One process per
  # scenario, driving the shipping code end to end against a synthetic Bloomberg; `run all`
  # returns non-zero on any red. It is time-of-day sensitive (needs London 00:10-23:50) and
  # fails loudly outside that window rather than passing quietly.
  #
  # 26 and 47 are SKIPPED because they read DateTime.Today and their premise cannot be built on
  # every weekday - 26 is "a Friday decision with the weekend after it", which a Friday run
  # cannot set up, and its 1w anchor then lands ON the decision instead of before it. They pass
  # Mon-Thu. Skipped here rather than muted so the ids stay visible; the fix is to give the
  # harness its own pinned weekday. Recorded in FINDINGS.md 2026-08-28.
  - script: >
      dotnet run --project tests/RateDesk.Scenarios/RateDesk.Scenarios.csproj -c Release --
      run all --skip 26,47 --out $(Build.ArtifactStagingDirectory)/scenarios
    displayName: CB decision scenarios (must stay green)

  - script: >
      dotnet publish src/RateDesk.Weekly/RateDesk.Weekly.csproj -c Release -r win-x64
      -o $(Build.ArtifactStagingDirectory)/app --self-contained true /p:PublishSingleFile=true
    displayName: publish RatesWeekly.exe

  - script: >
      dotnet publish src/RateDesk.Weekly.Cli/RateDesk.Weekly.Cli.csproj -c Release -r win-x64
      -o $(Build.ArtifactStagingDirectory)/cli --self-contained true /p:PublishSingleFile=true
    displayName: publish RatesWeeklyCli.exe

  - publish: $(Build.ArtifactStagingDirectory)
    artifact: ratesweekly-exes
    displayName: artifact ratesweekly-exes
